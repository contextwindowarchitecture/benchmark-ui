# benchmark-ui (its plan, section 12.3). Included in the default server of the UBI nginx image, whose root is
# /opt/app-root/src, the built app. The results volume is mounted at /data/results and served as /results/. The
# cluster mounts this file and headers.inc from a ConfigMap over /opt/app-root/etc/nginx.default.d; the image carries
# the same copies so `podman run` works on its own.

include /opt/app-root/etc/nginx.default.d/headers.inc;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types application/json application/x-ndjson application/javascript text/css text/plain image/svg+xml;

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# The app. index.html and config.json are never cached, so a rollout shows at once; hashed assets are immutable.
location = /index.html {
    include /opt/app-root/etc/nginx.default.d/headers.inc;
    add_header Cache-Control "no-cache" always;
}
location = /config.json {
    include /opt/app-root/etc/nginx.default.d/headers.inc;
    add_header Cache-Control "no-cache" always;
}
location /assets/ {
    include /opt/app-root/etc/nginx.default.d/headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location / {
    include /opt/app-root/etc/nginx.default.d/headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
}

# The results. A run is immutable once written and is served as such (on success only: a missing run's 404 must
# not be cached); a domain's index (results/<domain>/index.json) changes with every published run and is never
# cached. Directory listing stays off.
location /results/ {
    root /data;
    autoindex off;
    types {
        application/json         json;
        application/x-ndjson     jsonl;
        text/plain               txt toml md;
        application/octet-stream bin;
    }
    default_type application/octet-stream;
    include /opt/app-root/etc/nginx.default.d/headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location ~ ^/results/[^/]+/index\.json$ {
    root /data;
    default_type application/json;
    include /opt/app-root/etc/nginx.default.d/headers.inc;
    add_header Cache-Control "no-cache" always;
}
