# benchmark.contextwindowarchitecture.io. A rollout sets `newTag` below to the new image's git SHA (by hand:
# `kustomize edit set image` rewrites this file and drops its comments), then `oc apply -k deploy/overlays/prod` and
# `oc rollout status deployment/benchmark-ui`; a rollback is `oc rollout undo`.
#
# The cluster is a single node with LVM Storage (TopoLVM), whose only storage class, lvms-nvme-vg, provisions
# node-local ReadWriteOnce volumes: the base's ReadWriteMany claim cannot be provisioned there, so this overlay takes
# the plan's 12.2 fallback, recorded in docs/design/project-profile.md. One replica; the rolling update still has no
# unavailable replica, because every pod lands on the volume's node and a ReadWriteOnce volume mounts in any number
# of pods there.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cwa-benchmark

resources:
  - ../../base
  # TLS for the host from Let's Encrypt through the cluster's cert-manager (the README's "DNS and TLS").
  - issuer.yaml
  - certificate.yaml
  - router-secret-reader.yaml

images:
  - name: quay.io/contextwindowarchitecture/benchmark-ui
    newTag: ed062fd7c02d # the 12-character git SHA of the commit the image was built from

replicas:
  - name: benchmark-ui
    count: 1

patches:
  - target:
      kind: Route
      name: benchmark-ui
    patch: |
      - op: add
        path: /spec/host
        value: benchmark.contextwindowarchitecture.io
  # The Route reads the certificate from the secret cert-manager keeps (certificate.yaml) and carries none of its
  # own: the nulls clear a certificate set on the Route by hand, which the API refuses beside the reference. The API
  # also refuses a Route naming a secret that does not exist yet, so the first apply after DNS leaves the Route as
  # it was until the Certificate is Ready, and the next apply takes it (the README's "DNS and TLS").
  - target:
      kind: Route
      name: benchmark-ui
    patch: |
      - op: add
        path: /spec/tls/externalCertificate
        value:
          name: benchmark-ui-tls
      - op: add
        path: /spec/tls/certificate
        value: null
      - op: add
        path: /spec/tls/key
        value: null
      - op: add
        path: /spec/tls/caCertificate
        value: null
  # The results volume on this cluster (above). On a cluster with a ReadWriteMany class, name that class here, leave
  # the access mode to the base and raise the replicas.
  - target:
      kind: PersistentVolumeClaim
      name: benchmark-results
    patch: |
      - op: replace
        path: /spec/accessModes
        value: [ReadWriteOnce]
      - op: add
        path: /spec/storageClassName
        value: lvms-nvme-vg
