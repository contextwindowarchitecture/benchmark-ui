# The host's certificate, issued and renewed by cert-manager into the secret the Route's externalCertificate names.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: benchmark-ui-tls
spec:
  secretName: benchmark-ui-tls
  dnsNames:
    - benchmark.contextwindowarchitecture.io
  issuerRef:
    name: letsencrypt
    kind: Issuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
