# The router reads the certificate from the secret itself (Route spec.tls.externalCertificate), so its service
# account needs to read that one secret in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: benchmark-ui-tls-reader
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [benchmark-ui-tls]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: benchmark-ui-tls-reader
subjects:
  - kind: ServiceAccount
    name: router
    namespace: openshift-ingress
roleRef:
  kind: Role
  name: benchmark-ui-tls-reader
  apiGroup: rbac.authorization.k8s.io
