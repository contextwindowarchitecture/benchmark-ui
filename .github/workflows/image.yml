# Builds the site's image and pushes it to Quay, by hand only (workflow_dispatch), like the benchmark's CI. The tags
# are the commit's SHA and `latest`; the production overlay pins a SHA. Needs the repository secrets QUAY_USERNAME and
# QUAY_PASSWORD: a robot account with write access to quay.io/contextwindowarchitecture/benchmark-ui.
name: image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The commit or branch to build (default: the ref the workflow runs on)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - id: meta
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: redhat-actions/buildah-build@v3
        id: build
        with:
          image: benchmark-ui
          tags: ${{ steps.meta.outputs.sha }} latest
          containerfiles: deploy/Containerfile
          context: .
          oci: true
      - uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: quay.io/contextwindowarchitecture
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
